name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the C++ engine on desktop
        working-directory: engine
        run: |
          g++ -std=c++20 -O2 -pthread -Wall -Wextra code.cpp -o engine
          ./engine --selftest
          g++ -std=c++20 -O2 -pthread -DEBOV_NO_MAIN test_api.cpp code.cpp -o test_api
          ./test_api

  apk:
    runs-on: ubuntu-latest
    needs: engine-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''   # the action's default 'tools' package no longer exists; we install what we need below
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: List APK
        run: ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: ebov-tip-debug-apk
          path: app/build/outputs/apk/debug/*.apk
